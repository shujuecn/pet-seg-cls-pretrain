data_root: "./data"
image_size: 256
batch_size: 16
pretrain_batch_size: 160
num_workers: 4
seed: 42
device: "cuda"
amp: true
exp_name: "full_train"
output_dir: "./runs"
rebuild_split: false

split:
  val_ratio: 0.2
  test_ratio: 0.1

task:
  run_seg: true
  run_cls: true
  run_pretrain: true
  run_pretrained_encoder_to_seg: true

optim:
  lr: 1e-3
  weight_decay: 1e-4
  grad_clip_norm: 1.0
  grad_accum_steps: 1

scheduler:
  type: "cosine"  # none/cosine/plateau
  t_max: 10
  eta_min: 1e-6
  plateau_factor: 0.5
  plateau_patience: 3

epochs:
  seg: 30
  cls: 30
  pretrain: 10
  seg_ft: 30
  freeze_encoder_epochs: 5

model:
  base_channels: 32
  depth: 4
  num_classes: 3

pretrain:
  proj_dim: 128
  temperature: 0.2

loss:
  seg_ce_weight: 1.0
  seg_dice_weight: 0.5

dataloader:
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true

logging:
  log_images_every: 5
  num_visual_samples: 4

seg_output:
  save_original_size: true
  pred_mask_values: "zero_based"  # zero_based or one_based
  save_overlay: true

cls_output:
  save_topk_errors: true
  topk_errors: 12
